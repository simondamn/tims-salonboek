/* Layout: één kolom-app (max 560px) met merkband bovenin, tabbalk onderin en een groene + knop; formulieren schuiven als vel omhoog. */
:root{
  /* Tims-huisstijl: cremewit papier, zalmroze, wijnrood, olijfgroen. Eén lichte look, bewust zonder donkere variant. */
  --bg:#F8F6EC; --surface:#FFFEF8; --surface-2:#EFEDDB; --ink:#3B2727; --muted:#7E6A60; --line:#E6E1CC;
  --rose:#D1987D; --rose-soft:#F5E3D8; --rose-ink:#7A3F2B;
  --olive:#ADB546; --olive-soft:#EDEFC9; --olive-ink:#4D5214;
  --wine:#7D3446; --wine-soft:#F3DDE1;
  --cream:#E7E6CC;
  --ok:#557A2A; --ok-soft:#E4EDD2; --warn:#A8670C; --warn-soft:#F8E8C9; --bad:#B0302A; --bad-soft:#F8DAD6;
  --shadow:0 1px 2px rgba(125,52,70,.06),0 8px 22px rgba(125,52,70,.08);
  --f-display:"Zain","Fredoka","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --f-body:"Zain","Nunito","Avenir Next",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:18px;letter-spacing:.01em;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:.005em}

/* merkband */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--rose);color:var(--cream)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:12px;background:radial-gradient(circle at 50% 0,var(--rose) 11px,transparent 11.5px) 0 0/26px 12px repeat-x;pointer-events:none}
.top-in{max-width:560px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;gap:12px}

.mark-sub{font-weight:700;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--cream);align-self:flex-end;margin-bottom:2px}
.top .sp{flex:1}
.iconbtn{border:0;background:rgba(255,255,255,.22);color:var(--cream);width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.checker{background:conic-gradient(var(--wine) 25%,var(--rose) 0 50%,var(--wine) 0 75%,var(--rose) 0) 0 0/22px 22px}
.demo{background:var(--olive-soft);color:var(--olive-ink);font-size:15px;font-weight:700;text-align:center;padding:20px 16px 8px}

main{max-width:560px;margin:0 auto;padding:28px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:6px 2px -4px}
.sec-h h2{font-size:26px;color:var(--wine)}
.sec-h .meta{font-size:15px;color:var(--muted);font-weight:700}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px 16px}

/* dagkop */
.day{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.day h1{font-size:34px;line-height:1.05;color:var(--wine)}
.hero{position:relative;overflow:hidden;padding-top:0}
.hero .band{height:22px;margin:0 -16px}
.hero .hd{position:relative;min-height:92px;padding-right:96px;padding-top:4px}
.hero .dog{position:absolute;right:-4px;top:-6px;width:92px;height:auto}
.kpis{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:8px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .l{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.kpi .v{font-family:var(--f-display);font-size:clamp(20px,6vw,26px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.big{grid-column:1/-1;background:var(--olive-soft);color:var(--olive-ink)}
.kpi.big .l{color:inherit;opacity:.8}
.kpi.big .v{font-size:42px;line-height:1.1}

/* timer */
.timer{display:flex;align-items:center;gap:12px;background:var(--wine);color:#FFF8F0;border-radius:16px;padding:12px 14px}
.timer .t{font-family:var(--f-display);font-size:28px;font-weight:800}
.timer .who{flex:1;min-width:0;font-weight:700;line-height:1.2}
.timer .who small{display:block;font-weight:700;opacity:.8}
.timer button{border:0;border-radius:12px;padding:10px 14px;background:#FBF3EA;color:var(--wine);font-weight:800}
.dot{width:10px;height:10px;border-radius:50%;background:#FBF3EA;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

/* rijen */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;display:block}
.row .t1{font-weight:800;font-size:19px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .t2{display:block;font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-family:var(--f-display);font-weight:800;font-size:21px;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-family:var(--f-body);font-size:14px;font-weight:700;color:var(--muted);text-transform:lowercase}
.time{font-family:var(--f-display);font-weight:800;font-size:20px;min-width:48px;color:var(--rose-ink);background:var(--rose-soft);border-radius:10px;padding:6px 8px;text-align:center}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;background:var(--rose-soft);color:var(--rose-ink);flex:none}
.av.p{background:var(--olive-soft);color:var(--olive-ink)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;line-height:1.5}
.b-bijt{background:var(--bad-soft);color:var(--bad)}
.b-letop{background:var(--warn-soft);color:var(--warn)}
.b-lief{background:var(--ok-soft);color:var(--ok)}
.b-pay{background:var(--surface-2);color:var(--muted)}
.b-done{background:var(--ok-soft);color:var(--ok)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.empty img{width:70px;height:auto;display:block;margin:0 auto 8px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:18px;margin-bottom:4px}

/* knoppen */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn-p{background:var(--wine);color:var(--cream)}
.btn-o{background:var(--olive);color:#2E2A06}
.btn-s{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn-d{background:var(--bad-soft);color:var(--bad)}
.btn-sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* tabbalk */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end}
.tab{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;font-weight:800;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--wine)}
.fab{justify-self:center;width:64px;height:64px;border-radius:50%;border:4px solid var(--bg);background:var(--olive);color:#FFFEF5;transform:translateY(-14px);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:30px;height:30px}

/* vel */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(125,52,70,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:100%;height:calc(100% - 24px - env(safe-area-inset-top,0px));border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-h h2{flex:1;font-size:26px;color:var(--wine);min-width:0}
.x{border:0;background:var(--surface-2);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.sheet-b{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.sheet-f{border-top:1px solid var(--line);background:var(--surface);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.sheet-f .tot{flex:1;min-width:0}
.sheet-f .tot .v{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1}

/* formulier */
.fld{display:flex;flex-direction:column;gap:8px}
.fld > label,.lbl{font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:17px;min-height:48px}
.inp:focus{border-color:var(--olive);outline:none}
textarea.inp{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:700;font-size:17px;min-height:42px;display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.15}
.chip small{font-size:14px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:#FFF8F0}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.chip.price{min-width:92px}
.chip.price b{font-family:var(--f-display);font-weight:800;font-size:19px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 8px;font-weight:800;font-size:17px;min-height:56px}
.seg button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#2E2A06}
.seg.g button[data-v="lief"][aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg.g button[data-v="letop"][aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.seg.g button[data-v="bijt"][aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.mode button{border:0;background:none;border-radius:11px;padding:10px;font-weight:800;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.dogcard{border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.dogcard .hd{display:flex;gap:12px;align-items:center;padding:14px}
.dogcard .hd .n{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.1}
.dogcard .info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:0 14px 14px;font-size:14px}
.dogcard .info dt{color:var(--muted);font-weight:700}
.dogcard .info dd{margin:0;min-width:0}
.alert{display:flex;gap:10px;align-items:center;background:var(--bad-soft);color:var(--bad);font-weight:800;padding:10px 14px}
.alert.w{background:var(--warn-soft);color:var(--warn)}
.prodline{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.prodline:first-child{border-top:0}
.prodline .n{flex:1;min-width:0;font-weight:700}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:800}
.hint{font-size:15px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--wine);font-weight:800;text-decoration:underline;text-underline-offset:3px}

/* overzicht */
.periods{display:flex;align-items:center;gap:8px}
.periods .lab{flex:1;text-align:center;font-family:var(--f-display);font-size:20px;font-weight:800}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:150px;padding:8px 4px 0}
.bar{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px;border:0;background:none;padding:0;min-width:0}
.bar .s{border-radius:4px 4px 0 0;background:var(--rose)}
.bar .s.t{background:var(--olive);border-radius:0}
.bar .s.p{background:var(--wine);border-radius:0}
.bar[aria-current="true"] .s{outline:2px solid var(--ink);outline-offset:0}
.bar-l{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;padding:4px 4px 0;font-size:13px;font-weight:800;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--muted);font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.daygroup .dh{display:flex;justify-content:space-between;padding:10px 14px 4px;font-size:15px;font-weight:800;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.filters .chip{flex:none}

.xprev{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:14px;max-height:420px;overflow:auto;font-size:14px}
.xprev > *{min-width:0}
.xs-h{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--wine)}
.xs-m{font-weight:800;margin:6px 0 2px}
.xtable{overflow-x:auto}
.xtable table{border-collapse:collapse;width:100%}
.xtable th{text-align:left;font-size:13px;color:#fff;background:var(--rose);padding:4px 6px;font-weight:700}
.xtable td{padding:4px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.xtable td:first-child,.xtable td.r{white-space:nowrap}
.xtable .r{text-align:right}
.xtable .tot td{font-weight:800;border-bottom:0;background:var(--surface-2)}
.xtable .more{color:var(--muted);font-style:italic}
.sync{font-size:14px;font-weight:700;color:#FFF8F0;background:rgba(255,255,255,.22);padding:5px 11px;border-radius:999px;white-space:nowrap}
.sync[data-s="ok"]{background:transparent;opacity:.85}
.sync[data-s="wait"]{background:var(--wine)}
.set-h{font-size:24px;color:var(--wine)}
body.koppel .tabs,body.koppel #btn-settings,body.koppel #btn-klant{display:none}
.iconbtn{position:relative}
.iconbtn .ndot{position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:var(--wine);border:2px solid var(--bg)}
.pthumb{width:52px;height:52px;flex:none;border-radius:12px;overflow:hidden;background:var(--cream);border:1px solid var(--line, rgba(0,0,0,.08));display:grid;place-items:center;padding:0;cursor:pointer;font-size:20px}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb.big{width:96px;height:96px;font-size:30px;cursor:default}
.chip small .op{color:var(--bad)}
a.btn{text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--wine);color:#FFF8F0;padding:12px 18px;border-radius:14px;font-weight:800;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<script>
/* ============ Hulpjes ============ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return isoOf(d); };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const nlDag = (s, o={weekday:'short', day:'numeric', month:'short'}) => parseISO(s).toLocaleDateString('nl-NL', o);
const eur = n => { n = Number(n)||0; const c = Math.round(n*100) % 100 !== 0;
  return new Intl.NumberFormat('nl-NL', {style:'currency', currency:'EUR', minimumFractionDigits:c?2:0, maximumFractionDigits:2}).format(n); };
const r2 = n => Math.round((Number(n)||0)*100)/100;
const durTxt = m => m == null || m === '' ? '' : `${Math.floor(m/60)}:${pad(m%60)}`;
const parseDur = s => { s = String(s||'').trim(); if (!s) return null; let m = s.match(/^(\d+)[:.,](\d{1,2})$/); if (m) return (+m[1])*60 + (+m[2]);
  m = s.match(/^(\d+)\s*m/i); if (m) return +m[1]; if (/^\d+$/.test(s)) return +s <= 5 ? (+s)*60 : +s; return null; };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const ini = s => (s||'?').trim().charAt(0).toUpperCase() || '?';
const MAAND = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const MAANDL = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const GEDRAG = {lief:'Lief', letop:'Let op', bijt:'Bijt'};
const badge = g => g ? `<span class="badge b-${g}">${g==='bijt'?'⚠︎ ':''}${GEDRAG[g]}</span>` : '';
const pays = () => (S.data && S.data.instellingen.betaalwijzen && S.data.instellingen.betaalwijzen.length) ? S.data.instellingen.betaalwijzen : ['contant','tikkie'];
const payTxt = p => ({contant:'Contant', tikkie:'Tikkie', pin:'Pin'}[p] || p || '');
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
function fail(e){ console.error(e); toast('Dat lukte niet: ' + (e && e.message ? e.message : 'controleer je internet')); }
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } } };

/* ============ Staat ============ */
const S = { data:null, view:'vandaag', idx:null, periode:{soort:'maand', ref:todayISO().slice(0,7)}, hondFilter:'alle', zoek:'', agenda:{} };

function buildIndex(){
  const per = {};
  for (const r of S.data.registraties){ if (!r.hondId) continue; (per[r.hondId] ||= []).push(r); }
  const idx = {};
  for (const h of S.data.honden){
    const v = (per[h.id] || []).slice().sort((a,b)=>a.datum.localeCompare(b.datum));
    const last = v[v.length-1];
    let interval = null;
    if (v.length >= 2){ const gaps = []; for (let i=1;i<v.length;i++){ const g = daysBetween(v[i-1].datum, v[i].datum); if (g > 6) gaps.push(g); } if (gaps.length) interval = Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length); }
    idx[h.id] = { visits:v, last, interval, totaal:r2(v.reduce((a,b)=>a+(+b.totaal||0),0)), due: last && interval ? addDays(last.datum, interval) : null };
  }
  S.idx = idx;
}
const hondById = id => S.data.honden.find(h => h.id === id);
const sortedRegs = () => S.data.registraties.slice().sort((a,b)=> (b.datum+b.id).localeCompare(a.datum+a.id));

/* ============ Verbinding met de server ============ */
const APP_VERSIE = '1.2.0';
const MODE = (typeof google !== 'undefined' && google.script && google.script.run) ? 'gas' : (window.TIMS_PWA ? 'api' : 'demo');
const IS_LIVE = MODE !== 'demo';
const Conn = {
  get(){ return store.get('tims_conn', {}); },
  set(c){ store.set('tims_conn', c); },
  url(){ const u = (this.get().u || '').trim(); return /^https?:/.test(u) ? u : `https://script.google.com/macros/s/${u}/exec`; },
};
function leesKoppelLink(){
  if (window.TIMS_K){ const c = Conn.get(); c.k = window.TIMS_K; Conn.set(c); }
  // De link mag ?u=…&k=… (nieuw) of #u=…&k=… (oud) hebben. We laten hem in de adresbalk staan:
  // op de iPhone onthoudt "Zet op beginscherm" zo de koppeling, ook al deelt die geen opslag met Safari.
  const c = Conn.get(); let veranderd = false;
  for (const bron of [location.search.slice(1), (location.hash || '').slice(1)]){
    if (!/(^|&)k=/.test(bron)) continue;
    const p = new URLSearchParams(bron);
    if (p.get('k')){ c.k = p.get('k').trim(); veranderd = true; } if (p.get('u')){ c.u = p.get('u').trim(); veranderd = true; }
  }
  if (veranderd) Conn.set(c);
}
async function rpc(a, d){
  if (MODE === 'demo') return Demo.handle(a, d);
  const body = JSON.stringify({k: Conn.get().k || '', a, d: d || {}});
  let txt;
  if (MODE === 'gas'){
    txt = await new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => { const x = new Error(e && e.message || 'Geen verbinding'); x.net = true; no(x); }).api(body));
  } else {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 60000);
    try { const r = await fetch(Conn.url(), {method:'POST', body, redirect:'follow', signal:ctrl.signal}); if (!r.ok) { const x = new Error('Server gaf ' + r.status); x.net = true; throw x; } txt = await r.text(); }
    catch(e){ if (!e.net){ const x = new Error('Geen verbinding'); x.net = true; throw x; } throw e; }
    finally { clearTimeout(t); }
  }
  let j; try { j = JSON.parse(txt); } catch(e){ const x = new Error('Onverwacht antwoord van de server'); x.net = true; throw x; }
  if (j.versie) S.serverVersie = j.versie;
  if (!j.ok){ const x = new Error(j.error || 'Fout'); x.code = j.code; throw x; }
  return j.data;
}

/* ---- Voorbeeldmodus: zelfde acties, maar alles in deze browser ---- */
const DEMO_KEY = 'tims_demo_v2';
const Demo = {
  st: null,
  load(){
    if (this.st) return this.st;
    let s = null; try { s = JSON.parse(localStorage.getItem(DEMO_KEY) || 'null'); } catch(e){}
    if (!s){ s = JSON.parse(JSON.stringify(window.TIMS_SEED || {honden:[],registraties:[],producten:[],instellingen:{}})); s.agenda = Demo.sampleAgenda(s); Demo.voorbeeldKlanten(s); }
    this.st = s; return s;
  },
  save(){ try { localStorage.setItem(DEMO_KEY, JSON.stringify(this.st)); } catch(e){} },
  sampleAgenda(s){
    const pick = n => s.honden.find(h => h.naam === n);
    const mk = (dOff, hh, mm, naam, dur, bron) => { const h = pick(naam); const d = new Date(); d.setDate(d.getDate()+dOff); d.setHours(hh,mm,0,0);
      const e = new Date(d.getTime() + (dur||90)*60000); return {id:'e'+Math.random().toString(36).slice(2,9), start:d.toISOString(), end:e.toISOString(), hondId:'', titel:h?`${h.eigenaar||'?'} (${h.naam})`:naam, bron:bron||'apple'}; };
    return [mk(0,9,0,'Peppa',180), mk(0,13,0,'Toby',90), mk(0,15,0,'Olaf',120,'app'), mk(1,10,0,'Lotta',120), mk(2,9,0,'Scooby',90), mk(5,11,0,'Boet',150,'app')];
  },
  voorbeeldKlanten(s){
    // Een paar voorbeelden zodat je ziet hoe bestellingen en afspraakverzoeken uit de klantenapp binnenkomen
    const nu = Date.now(), p = n => (s.producten||[]).find(x => x.naam.toLowerCase().includes(n));
    const sh = p('shampoo'), ba = p('bandana');
    (s.producten||[]).forEach((x,i) => { if (x.voorraad == null) x.voorraad = [6,4,3,8,20,2][i % 6]; if (x.zichtbaar == null) x.zichtbaar = true; });
    s.bestellingen = [sh && {id:'b_demo1', tijd:new Date(nu-3*36e5).toISOString(), klantcode:'', naam:'Sanne de Vries', telefoon:'0612345678', items:[{id:sh.id, naam:sh.naam, prijs:sh.prijs, aantal:1}].concat(ba ? [{id:ba.id, naam:ba.naam, prijs:ba.prijs, aantal:1}] : []), totaal:r2(sh.prijs + (ba ? ba.prijs : 0)), ophalen:'Bij de volgende afspraak', opmerking:'', status:'nieuw'}].filter(Boolean);
    s.aanvragen = [{id:'a_demo1', tijd:new Date(nu-20*6e4).toISOString(), klantcode:'', naam:'Ellen', telefoon:'0687654321', hond:'Ollie', behandeling:'Complete trimbeurt', voorkeur:'Volgende week, ochtend', opmerking:'Liefst niet op woensdag', status:'nieuw'}];
  },
  up(list, obj){ const i = list.findIndex(x => x.id === obj.id); if (i >= 0) list[i] = obj; else list.push(obj); },
  async handle(a, d){
    const st = this.load();
    switch (a){
      case 'load': return JSON.parse(JSON.stringify({honden:st.honden, registraties:st.registraties, producten:st.producten, bestellingen:st.bestellingen||[], aanvragen:st.aanvragen||[], instellingen:st.instellingen}));
      case 'fotoUpload': return {demo:true};
      case 'sync': d.ops.forEach(op => applyOp(st, op.a, op.d)); this.save(); return {done: d.ops.map(o => o.q), errors: []};
      case 'agenda': { const a1 = new Date(d.van).getTime(), b1 = new Date(d.tot).getTime(); return (st.agenda||[]).filter(e => { const t = new Date(e.start).getTime(); return t >= a1 && t < b1; }).sort((x,y)=>x.start.localeCompare(y.start)); }
      case 'plan': { const out = d.starts.map(iso => { const s = new Date(iso); const ev = {id:'e'+Math.random().toString(36).slice(2,9), start:s.toISOString(), end:new Date(s.getTime()+d.duur*60000).toISOString(), hondId:d.hondId, titel:d.titel, bron:'app'}; st.agenda.push(ev); return ev; }); this.save(); return out; }
      case 'deleteAfspraak': st.agenda = st.agenda.filter(e => e.id !== d.id); this.save(); return 'ok';
      case 'backupStatus': case 'backupNu': return {aantal:0, laatst:null, demo:true};
      case 'export': return {demo:true};
      case 'testIcloud': return {aantal: 12, demo:true};
      case 'koppelInfo': return {demo:true};
      case 'ping': return {versie:'demo'};
    }
  },
};

/* ---- Wijzigingen: eerst lokaal bewaard, dan naar de server (ook als je even geen internet hebt) ---- */
const KEY_Q = 'tims_wachtrij_' + MODE, KEY_CACHE = 'tims_cache_' + MODE, KEY_REJ = 'tims_geweigerd_' + MODE;
function applyOp(data, a, d){
  const up = (list, o) => { const i = list.findIndex(x => x.id === o.id); if (i >= 0) list[i] = o; else list.push(o); };
  data.producten ||= []; data.bestellingen ||= []; data.aanvragen ||= [];
  const voorraadDelta = (oud, nieuw) => { const t = {}; (oud||[]).forEach(p => t[p.naam] = (t[p.naam]||0) + (+p.aantal||1)); (nieuw||[]).forEach(p => t[p.naam] = (t[p.naam]||0) - (+p.aantal||1));
    Object.keys(t).forEach(n => { const p = data.producten.find(x => x.naam === n); if (p && p.voorraad != null && t[n]) p.voorraad = Math.max(0, +p.voorraad + t[n]); }); };
  if (a === 'saveReg'){ const oud = data.registraties.find(r => r.id === d.id); if (!d.bestellingId) voorraadDelta(oud ? oud.producten : [], d.producten); up(data.registraties, JSON.parse(JSON.stringify(d))); }
  else if (a === 'deleteReg'){ const oud = data.registraties.find(r => r.id === d.id); if (oud && !oud.bestellingId) voorraadDelta(oud.producten, []); data.registraties = data.registraties.filter(r => r.id !== d.id); }
  else if (a === 'saveProduct'){ const oud = data.producten.find(p => p.id === d.id); const n = Object.assign({}, oud || {}, JSON.parse(JSON.stringify(d))); if (oud){ n.voorraad = oud.voorraad; n.foto = oud.foto; if (oud.fotoData) n.fotoData = oud.fotoData; } up(data.producten, n); }
  else if (a === 'deleteProduct') data.producten = data.producten.filter(p => p.id !== d.id);
  else if (a === 'voorraad'){ const p = data.producten.find(x => x.id === d.id); if (p){ const nu = p.voorraad == null || p.voorraad === '' ? null : +p.voorraad; let w = d.waarde == null || d.waarde === '' ? null : +d.waarde;
    if (w !== null && nu !== null && d.basis != null) w = Math.max(0, w + (nu - +d.basis)); p.voorraad = w; } }
  else if (a === 'bestellingStatus'){ const b = data.bestellingen.find(x => x.id === d.id); if (b){
    if (d.status === 'geannuleerd' && b.status !== 'geannuleerd' && b.status !== 'opgehaald') (b.items||[]).forEach(it => { const p = data.producten.find(x => x.id === it.id); if (p && p.voorraad != null) p.voorraad = +p.voorraad + (+it.aantal||1); });

  items(){ return store.get(KEY_Q, []); },
  save(l){ if (!store.set(KEY_Q, l)) toast('Let op: opslaan op dit apparaat lukt niet. Houd de app open tot alles verstuurd is.'); },
  push(a, d){ const l = this.items(); l.push({q: uid('q'), a, d, t: Date.now()}); this.save(l); applyOp(S.data, a, d); cacheSave(); buildIndex(); syncSoon(150); setStatus(); },
};
function cacheSave(){ if (S.data) store.set(KEY_CACHE, S.data); }
let syncBusy = false, syncTimer = null, syncDelay = 2000, syncErr = null;
function syncSoon(ms){ clearTimeout(syncTimer); syncTimer = setTimeout(flush, ms == null ? 300 : ms); }
async function flush(){
  if (syncBusy) return;
  const l = Q.items(); if (!l.length){ syncErr = null; setStatus(); return; }
  syncBusy = true; setStatus();
  try {
    const batch = l.slice(0, 25);
    const r = await rpc('sync', {ops: batch.map(x => ({q:x.q, a:x.a, d:x.d}))});
    const done = new Set(r.done || []); const bad = new Map((r.errors || []).map(e => [e.q, e.error]));
    const rej = store.get(KEY_REJ, []);
    Q.save(Q.items().filter(x => { if (bad.has(x.q)){ rej.push({...x, fout: bad.get(x.q)}); return false; } return !done.has(x.q); }));
    if (bad.size){ store.set(KEY_REJ, rej); toast('Een wijziging kon niet worden opgeslagen. Zie Instellingen.'); }
    syncErr = null; syncDelay = 2000; syncBusy = false;
    if (Q.items().length) return syncSoon(50);
  } catch(e){
    syncBusy = false; syncErr = e;
    if (e.code === 'auth'){ setStatus(); return toonKoppel('Deze app is niet meer gekoppeld. Vul de koppelcode opnieuw in; je wijzigingen staan nog klaar.'); }
    syncDelay = Math.min(syncDelay * 2, 60000); syncSoon(syncDelay);
  }
  setStatus();
}
function setStatus(){
  const el = document.getElementById('sync'); if (!el) return;
  const n = Q.items().length;
  if (!IS_LIVE){ el.hidden = true; return; }
  el.hidden = false;
  if (!n){ el.dataset.s = 'ok'; el.textContent = '✓ Opgeslagen'; }
  else if (syncErr){ el.dataset.s = 'wait'; el.textContent = `Offline · ${n} wacht${n===1?'':'en'}`; }
  else { el.dataset.s = 'busy'; el.textContent = 'Opslaan…'; }
}

const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
/** Herkent de hond uit een agendatitel zoals Kim ze schrijft: "Carmen/marc (Milo)" of "Lars/bo (boef) rood". */
function matchHond(titel){
  const t = norm(titel); if (!t) return null;
  const m = t.match(/\(([^)]+)\)/);
  const namen = m ? m[1].split(/,|&|\/|\+| en /).map(s => s.trim()).filter(Boolean) : [];
  const buiten = (m ? t.replace(m[0], ' ') : t).replace(/[\/,&+()]/g, ' ');
  const woorden = new Set(buiten.split(/\s+/).filter(w => w.length > 1));
  const score = h => {
    const n = norm(h.naam); if (!n) return 0;
    let s = 0;
    if (namen.includes(n)) s = 10; else if (!m && new RegExp('(^|\\s)' + reEsc(n) + '($|\\s)').test(t)) s = 6;
    if (!s) return 0;
    const eig = norm(h.eigenaar).split(/[\s\/,&]+/).filter(w => w.length > 1 && w !== 'en');
    if (eig.some(w => woorden.has(w))) s += 6;
    else if (eig.length && woorden.size && [...woorden].some(w => w.length > 2)) return 0; // andere eigenaar in de titel: niet gokken
    return s;
  };
  const best = S.data.honden.filter(h => !h.archief).map(h => ({h, s:score(h)})).filter(x => x.s)
    .sort((a, b) => b.s - a.s || ((S.idx[b.h.id].last || {}).datum || '').localeCompare((S.idx[a.h.id].last || {}).datum || ''));
  if (!best.length) return null;
  if (best.length > 1 && best[0].s === best[1].s) return null; // twee honden met dezelfde naam: laat Kim kiezen
  return best[0].h;
}
function verrijk(evs){

  });
  return evs;
}

function regRow(r){

  const sub = r.type === 'trim' ? [r.ras, r.klant, durTxt(r.duur), ex, prod && '+ '+prod].filter(Boolean).join(' · ') : [r.klant, 'verkoop'].filter(Boolean).join(' · ');

}
function evRow(e){

function bindRows(el){

function afrekenen(e){
  const done = S.data.registraties.find(r => r.afspraakId === e.id);

  const m = norm(e.titel).match(/\(([^)]+)\)/);

function periodRange(){
  const p = S.periode; const [y, m] = p.ref.split('-').map(Number);
  if (p.soort === 'maand') return {van:`${y}-${pad(m)}-01`, tot:isoOf(new Date(y, m, 0)), label:`${MAANDL[m-1]} ${y}`, y};
  if (p.soort === 'kwartaal'){ const q = Math.floor((m-1)/3); return {van:`${y}-${pad(q*3+1)}-01`, tot:isoOf(new Date(y, q*3+3, 0)), label:`Q${q+1} ${y}`, y}; }
  return {van:`${y}-01-01`, tot:`${y}-12-31`, label:String(y), y};
}
function shiftPeriod(dir){
  const p = S.periode; let [y, m] = p.ref.split('-').map(Number);
  const step = p.soort === 'maand' ? 1 : p.soort === 'kwartaal' ? 3 : 12; m += dir*step;
  while (m > 12){ m -= 12; y++; } while (m < 1){ m += 12; y--; } p.ref = `${y}-${pad(m)}`;
}
function totals(regs){
  const t = {totaal:0, contant:0, tikkie:0, pin:0, trim:0, prod:0, n:0};
  for (const r of regs){ t.totaal += +r.totaal||0; t[r.betaal] = (t[r.betaal]||0) + (+r.totaal||0); t.trim += +r.bedragTrim||0; t.prod += +r.bedragProducten||0; if (r.type==='trim') t.n++; }
  for (const k in t) t[k] = r2(t[k]); return t;
}
function viewOverzicht(el){
  const R = periodRange();
  const regs = S.data.registraties.filter(r => r.datum >= R.van && r.datum <= R.tot);
  const t = totals(regs);
  const showPin = pays().includes('pin') || t.pin > 0;

function maandLabel(maanden){

  const nums = s.map(m => +m.slice(5,7));
  if (ys.size === 1){
    if (s.length === 12) return 'heel ' + y;
    if (s.length === 3 && nums[0] % 3 === 1 && nums[2] === nums[0]+2) return `Q${(nums[0]+2)/3} ${y}`;
    if (s.length === 1) return `${MAANDL[nums[0]-1]} ${y}`;

function verklein(file){
  return new Promise((ok, no) => { const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => { const max = 1000, s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.82)); };
    img.onerror = () => no(new Error('Deze foto kan niet worden gelezen')); img.src = u; });
}

    ${IS_LIVE ? `<section class="stack" style="gap:10px"><h3 class="set-h">Ander apparaat koppelen</h3><div id="s-kop" class="stack" style="gap:8px"><p class="hint" style="margin:0">Link ophalen…</p></div></section>` : ''}

    </section>
    <section class="stack" style="gap:6px"><h3 class="set-h">Over</h3><p class="hint" style="margin:0">Tims Salonboek ${APP_VERSIE}${S.serverVersie ? ' · server ' + esc(S.serverVersie) : ''} · ${MODE === 'api' ? 'losse app' : MODE === 'gas' ? 'Google web-app' : 'voorbeeldversie'}</p>
      ${!IS_LIVE ? `<button class="btn btn-s btn-sm" id="s-reset" style="align-self:flex-start">Voorbeeld terugzetten</button>` : `<button class="btn btn-s btn-sm" id="s-los" style="align-self:flex-start">Dit apparaat ontkoppelen</button>`}</section>`;
  sheet('Instellingen', '<div id="setform" class="stack" style="gap:26px"></div>', `<button class="btn btn-p" id="s-save" style="flex:1">Opslaan</button>`);
  const lijsten = {k: ins.prijsknoppen, x: ins.extras, p: prods};
  const draw = () => {
    const sc = $('.sheet-b').scrollTop; $('#setform').innerHTML = body(); $('.sheet-b').scrollTop = sc; bind();
  };
  const bind = () => {
    const b = $('#setform');
    $$('[data-l]', b).forEach(x => x.oninput = () => { const o = lijsten[x.dataset.l][+x.dataset.i]; const f = x.dataset.f;
      if (f === 'prijs') o.prijs = parseFloat(x.value.replace(',','.')) || 0; else if (f === 'duur') o.duur = parseDur(x.value); else o[f] = x.value; });
    $$('[data-weg]', b).forEach(x => x.onclick = () => { const [l, i] = x.dataset.weg.split(':'); lijsten[l].splice(+i, 1); draw(); });
    $$('[data-add]', b).forEach(x => x.onclick = () => { const l = x.dataset.add;
      if (l === 'k') ins.prijsknoppen.push({label:'', prijs:0, duur:90}); else if (l === 'x') ins.extras.push({naam:'', prijs:0}); else prods.push({id:uid('p'), naam:'', prijs:0, actief:true});
      draw(); const last = $$(`[data-l="${l}"]`).filter(i => i.dataset.f === 'label' || i.dataset.f === 'naam').pop(); if (last) last.focus(); });
    $$('[data-pt]', b).forEach(x => x.onclick = () => { const p = prods[+x.dataset.pt]; p.actief = p.actief === false; x.setAttribute('aria-pressed', String(p.actief)); x.textContent = p.actief ? 'Aan' : 'Uit'; });
    $$('[data-bw]', b).forEach(x => x.onclick = () => { const p = x.dataset.bw; const i = ins.betaalwijzen.indexOf(p); if (i>=0) ins.betaalwijzen.splice(i,1); else ins.betaalwijzen.push(p); ins.betaalwijzen.sort((a,c)=>['contant','tikkie','pin'].indexOf(a)-['contant','tikkie','pin'].indexOf(c)); x.setAttribute('aria-pressed', String(i<0)); });

    $('#s-snit', b).oninput = e => { ins.snitten = e.target.value.split(',').map(s => s.trim()).filter(Boolean); };
    $('#s-ical', b).oninput = e => { ins.icloudLink = e.target.value.trim(); };
    $('#s-ical-test', b).onclick = async () => { const res = $('#s-ical-res'); const l = ins.icloudLink; if (!/^(webcal|https):\/\/.+/i.test(l||'')) { res.textContent = 'Plak eerst de link die met webcal:// begint.'; return; }
      res.textContent = 'Testen…'; try { const r = await rpc('testIcloud', {link:l}); res.textContent = `✓ Gelukt: ${r.aantal} afspraken gevonden. Tik op Opslaan.`; } catch(e){ res.textContent = '✗ ' + (e.net ? 'Geen internet.' : e.message); } };
    const bst = r => { const el = $('#s-bstat'); if (!el) return; el.textContent = r.demo ? 'In de echte app wordt elke nacht automatisch een volledige kopie gemaakt in Google Drive (map “Tims – backups”).' : (r.laatst ? `${r.aantal} kopieën in Google Drive, map “Tims – backups”. Laatste: ${new Date(r.laatst).toLocaleString('nl-NL',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}. Elke nacht komt er automatisch een bij.` : 'Nog geen backup gevonden. Maak er nu een.'); };
    if (!S._bst) api.backupStatus().then(r => { S._bst = r; bst(r); }).catch(()=>{ const el = $('#s-bstat'); if (el) el.textContent = 'Status kon niet laden (geen internet?).'; }); else bst(S._bst);
    $('#s-bnu', b).onclick = async e => { const k = e.currentTarget; k.disabled = true; k.textContent = 'Bezig…'; try { S._bst = await api.backupNu(); bst(S._bst); toast('Backup gemaakt ✓'); } catch(err){ fail(err); } k.disabled = false; k.textContent = 'Nu een backup maken'; };
    const rj = $('#s-rej', b); if (rj) rj.onclick = () => { const l = Q.items(); store.get(KEY_REJ, []).forEach(x => l.push({q:x.q, a:x.a, d:x.d, t:x.t})); Q.save(l); store.set(KEY_REJ, []); syncSoon(50); closeSheet(); toast('Wordt opnieuw verstuurd'); };
    const rs = $('#s-reset', b); if (rs) rs.onclick = () => { [DEMO_KEY, KEY_Q, KEY_CACHE, 'tims_concept'].forEach(k => { try { localStorage.removeItem(k); } catch(e){} }); Demo.st = null; closeSheet(); start(); };

async function koppelBlok(){
  const el = $('#s-kop'); if (!el) return;
  let link = '';
  if (MODE === 'api'){ const c = Conn.get(); link = `${location.origin}${location.pathname}?u=${encodeURIComponent(c.u)}&k=${encodeURIComponent(c.k)}`; }
  else { try { const i = await rpc('koppelInfo'); link = i.pwaLink || ''; } catch(e){} }
  if (!$('#s-kop')) return;
  if (!link){ el.innerHTML = `<p class="hint" style="margin:0">De losse app is nog niet ingesteld. Open de app op een ander apparaat via de link van Simon en vul de koppelcode in.</p>`; return; }
  el.innerHTML = `<p class="hint" style="margin:0">Scan deze code met de camera van je telefoon, of stuur jezelf de link. Daarna: Deel → Zet op beginscherm.</p><div id="s-qr" style="background:#fff;border-radius:14px;padding:12px;align-self:flex-start"></div>
    <div class="btnrow"><button class="btn btn-s btn-sm" id="s-kop-copy">Kopieer link</button></div><p class="hint" style="margin:0">Deel deze link met niemand anders: met de link kun je bij alle gegevens.</p>`;
  $('#s-kop-copy').onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('Link gekopieerd')).catch(() => { toast('Kopiëren lukt hier niet; houd de link ingedrukt om te kopiëren'); }); };
  try { await laadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'); const q = qrcode(0, 'M'); q.addData(link); q.make(); $('#s-qr').innerHTML = q.createSvgTag({cellSize:4, margin:0}); } catch(e){ $('#s-qr').remove(); }
}
function laadScript(src){ return new Promise((ok, no) => { if ([...document.scripts].some(s => s.src === src)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }

/* ============ Vel ============ */
function sheet(title, body, foot){
  const root = $('#sheet-root');
  root.innerHTML = `<div class="sheet-wrap" id="sw"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h2>${esc(title)}</h2><button class="x" id="sx" aria-label="Sluiten"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="sheet-b">${body}</div>${foot ? `<div class="sheet-f">${foot}</div>` : ''}</div></div>`;
  $('#sx').onclick = closeSheet;
  $('#sw').onclick = e => { if (e.target.id === 'sw') closeSheet(); };
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  const wasForm = !!$('#regform');
  $('#sheet-root').innerHTML = ''; document.body.style.overflow = '';
  if (wasForm && conceptWaard()) { bewaarConcept(); if (S.view === 'vandaag') render(); }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sw')) closeSheet(); });

/* ---- Concept: een half ingevulde registratie gaat nooit verloren ---- */
function conceptWaard(){ return F && !F._klaar && (F.hondId || F._nieuw || F.basis != null || F.producten.length || F.extras.length); }
function bewaarConcept(){ if (conceptWaard()) store.set('tims_concept', {F, t:Date.now()}); }
function wisConcept(){ try { localStorage.removeItem('tims_concept'); } catch(e){} }
function conceptBanner(){
  const c = store.get('tims_concept', null); if (!c || Date.now() - c.t > 3*864e5) return '';
  const h = c.F.hondId ? hondById(c.F.hondId) : null; const wie = h ? h.naam : c.F._nieuw ? c.F._nieuw.naam || 'nieuwe hond' : 'verkoop';
  return `<div class="card pad stack" style="gap:8px;border-color:var(--olive)"><b>Niet afgemaakte registratie: ${esc(wie)}</b><div class="btnrow"><button class="btn btn-o btn-sm" id="c-verder">Verder invullen</button><button class="btn btn-s btn-sm" id="c-weg">Weggooien</button></div></div>`;
}
setInterval(() => { if ($('#regform')) bewaarConcept(); }, 4000);
window.addEventListener('pagehide', () => { if ($('#regform')) bewaarConcept(); cacheSave(); });

        ${MODE === 'api' ? `<div class="fld"><label for="k-u">Adres</label><input class="inp" id="k-u" autocomplete="off" autocapitalize="off" placeholder="AKfycb… of https://script.google.com/…" value="${esc(c.u||'')}"></div>` : ''}
        <div class="fld"><label for="k-k">Koppelcode</label><input class="inp" id="k-k" autocomplete="off" autocapitalize="characters" placeholder="TIMS-XXXX-XXXX-XXXX-XXXX" value="${esc(c.k||'')}"></div>
        <button class="btn btn-p" type="submit">Koppelen</button><p class="hint" id="k-res" style="margin:0"></p>
      </form></section></div>`;
  $('#k-form').onsubmit = async e => {
    e.preventDefault(); const res = $('#k-res');
    const nc = {k: $('#k-k').value.trim().toUpperCase(), u: MODE === 'api' ? $('#k-u').value.trim() : ''};
    if (!nc.k) return res.textContent = 'Vul de koppelcode in.';
    if (MODE === 'api' && !nc.u) return res.textContent = 'Vul het adres in.';
    const oud = Conn.get(); Conn.set(nc); res.textContent = 'Controleren…';
    try { await rpc('ping'); document.body.classList.remove('koppel'); toast('Gekoppeld ✓'); start(); }
    catch(err){ Conn.set(oud); res.textContent = err.code === 'auth' ? 'Deze code klopt niet. Let op streepjes en hoofdletters.' : (err.net ? 'Geen verbinding met de server. Klopt het adres en is er internet?' : err.message); }

}

/* ============ Start ============ */
const STANDAARD = {
  prijsknoppen: [{label:'Puppy', prijs:50, duur:60},{label:'Standaard', prijs:65, duur:90},{label:'Doodle', prijs:85, duur:120},{label:'Groot', prijs:125, duur:180},{label:'Tussenbeurt', prijs:25, duur:30},{label:'Nagels', prijs:7.5, duur:5}],
  extras: [{naam:'Klitten / vervilting', prijs:10},{naam:'Nagels knippen', prijs:7.5},{naam:'Oren plukken', prijs:5},{naam:'Anti-vlooienbad', prijs:10}],
  betaalwijzen: ['contant','tikkie'], snitten: [],
  salon: {naam:'Tims Hondentrimsalon', adres:'Bromeliastraat 22, 7591 XW Denekamp', telefoon:'06 47563988', email:'timshondensalon@gmail.com', openingstijden:'Maandag t/m vrijdag 09.00 – 18.00',
    instagram:'https://www.instagram.com/timshondensalon/', facebook:'', website:'', reviewLink:'', meldEmail:'',
    welkom:'Fijn dat je er bent! Hier zie je je afspraken, zet je ze in je agenda en reserveer je producten om op te halen.', ophalen:'Je bestelling ligt voor je klaar in de salon. Je betaalt bij het ophalen, contant of met Tikkie.'},
  diensten: [{naam:'Complete trimbeurt', omschrijving:'Wassen, föhnen, knippen of trimmen, nagels en oren', vanaf:65},{naam:'Doodle-beurt', omschrijving:'Voor krullende en wollige vachten', vanaf:85},{naam:'Puppybeurt', omschrijving:'Rustig kennismaken met de salon', vanaf:50},{naam:'Tussenbeurt', omschrijving:'Snuitje, voetjes en billen bijwerken', vanaf:25},{naam:'Nagels knippen', omschrijving:'Zonder afspraak in overleg', vanaf:7.5}],
};
function normaliseer(d){
  d = d || {}; d.honden ||= []; d.registraties ||= []; d.producten ||= []; d.bestellingen ||= []; d.aanvragen ||= [];
  d.instellingen = Object.assign(JSON.parse(JSON.stringify(STANDAARD)), d.instellingen || {});
  d.instellingen.salon = Object.assign({}, STANDAARD.salon, d.instellingen.salon || {});
  const bool = (v, def) => v === '' || v == null ? def : (v === true || v === 'TRUE' || v === 'true');
  d.producten.forEach(p => { p.actief = bool(p.actief, true); p.zichtbaar = bool(p.zichtbaar, true); p.voorraad = p.voorraad === '' || p.voorraad == null ? null : +p.voorraad; p.prijs = +p.prijs || 0; });
  d.bestellingen.forEach(b => { b.items ||= []; b.totaal = +b.totaal || 0; });
  d.registraties.forEach(r => { r.datum = String(r.datum).slice(0,10); r.producten ||= []; r.extras ||= []; });
  d.honden.forEach(h => { h.archief = h.archief === true || h.archief === 'TRUE'; });
  return d;
}
function migreer(){
  const ins = S.data.instellingen; let veranderd = false;
  if (!ins._v2){ if (!ins.snitten.includes('Wasbeurt')) ins.snitten.splice(Math.min(6, ins.snitten.length), 0, 'Wasbeurt'); ins._v2 = true; veranderd = true; }
  if (!ins._v3){ ins._v3 = true; veranderd = true; }
  if (veranderd) Q.push('saveInstellingen', {obj: ins});
}
async function laadServer(){
  const data = normaliseer(await rpc('load'));
  Q.items().forEach(op => applyOp(data, op.a, op.d));
  S.data = data; S.geladen = Date.now(); buildIndex(); migreer(); cacheSave();
}
function herlaad(){
  laadServer().then(() => { const a = document.activeElement; if (!$('#sw') && !(a && /INPUT|TEXTAREA/.test(a.tagName))) render(); }).catch(() => {});
}
function toonApp(){ document.body.classList.remove('koppel'); const v = store.get('tims_view', 'vandaag'); go(['vandaag','honden','agenda','overzicht'].includes(v) ? v : 'vandaag'); }
async function start(){
  leesKoppelLink();
  $('#demo-banner').hidden = IS_LIVE;
  const c = Conn.get();
  if (IS_LIVE && (!c.k || (MODE === 'api' && !c.u))) return toonKoppel();
  const cache = store.get(KEY_CACHE, null);
  if (cache){ S.data = normaliseer(cache); buildIndex(); toonApp(); }
  try { await laadServer(); if (!cache) toonApp(); else herlaadView(); }
  catch(e){
    if (e.code === 'auth') return toonKoppel('De koppelcode klopt niet (meer). Vraag Simon om de nieuwe code; je wijzigingen staan nog klaar.');
    if (!cache){ $('#view').innerHTML = `<div class="loading stack" style="text-align:center;gap:12px"><div>${e.net ? 'Geen verbinding met de server. Is er internet?' : 'Kon het salonboek niet laden: ' + esc(e.message)}</div><button class="btn btn-p" onclick="start()">Opnieuw proberen</button></div>`; return; }
    toast(e.net ? 'Geen internet: je ziet de laatst bewaarde gegevens' : 'Laden mislukt: ' + e.message);
  }
  setStatus(); syncSoon(400);
}
function herlaadView(){ const a = document.activeElement; if (!$('#sw') && !(a && /INPUT|TEXTAREA/.test(a.tagName))) render(); }
$$('.tab').forEach(t => t.onclick = () => go(t.dataset.tab));
$('#fab').onclick = () => openReg({});
$('#btn-settings').onclick = () => openSettings();
$('#btn-klant').onclick = () => openKlantenapp();
start();
</script>

<script>
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    setInterval(() => reg.update(), 30 * 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
  }).catch(() => {});
  let herladen = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || herladen) return; herladen = true;
    const wacht = () => { if (document.getElementById('sw')) return setTimeout(wacht, 5000); location.reload(); };
    wacht();
  });
}
</script>
