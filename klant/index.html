/* Layout: één kolom-app (max 560px) met merkband bovenin, tabbalk onderin en een groene + knop; formulieren schuiven als vel omhoog. */
:root{
  /* Tims-huisstijl: cremewit papier, zalmroze, wijnrood, olijfgroen. Eén lichte look, bewust zonder donkere variant. */
  --bg:#F8F6EC; --surface:#FFFEF8; --surface-2:#EFEDDB; --ink:#3B2727; --muted:#7E6A60; --line:#E6E1CC;
  --rose:#D1987D; --rose-soft:#F5E3D8; --rose-ink:#7A3F2B;
  --olive:#ADB546; --olive-soft:#EDEFC9; --olive-ink:#4D5214;
  --wine:#7D3446; --wine-soft:#F3DDE1;
  --cream:#E7E6CC;
  --ok:#557A2A; --ok-soft:#E4EDD2; --warn:#A8670C; --warn-soft:#F8E8C9; --bad:#B0302A; --bad-soft:#F8DAD6;
  --shadow:0 1px 2px rgba(125,52,70,.06),0 8px 22px rgba(125,52,70,.08);
  --f-display:"Zain","Fredoka","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --f-body:"Zain","Nunito","Avenir Next",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:18px;letter-spacing:.01em;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:.005em}

/* merkband */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--rose);color:var(--cream)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:12px;background:radial-gradient(circle at 50% 0,var(--rose) 11px,transparent 11.5px) 0 0/26px 12px repeat-x;pointer-events:none}
.top-in{max-width:560px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;gap:12px}

.mark-sub{font-weight:700;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--cream);align-self:flex-end;margin-bottom:2px}
.top .sp{flex:1}
.iconbtn{border:0;background:rgba(255,255,255,.22);color:var(--cream);width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.checker{background:conic-gradient(var(--wine) 25%,var(--rose) 0 50%,var(--wine) 0 75%,var(--rose) 0) 0 0/22px 22px}
.demo{background:var(--olive-soft);color:var(--olive-ink);font-size:15px;font-weight:700;text-align:center;padding:20px 16px 8px}

main{max-width:560px;margin:0 auto;padding:28px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:6px 2px -4px}
.sec-h h2{font-size:26px;color:var(--wine)}
.sec-h .meta{font-size:15px;color:var(--muted);font-weight:700}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-ink)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px 16px}

/* dagkop */
.day{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.day h1{font-size:34px;line-height:1.05;color:var(--wine)}
.hero{position:relative;overflow:hidden;padding-top:0}
.hero .band{height:22px;margin:0 -16px}
.hero .hd{position:relative;min-height:92px;padding-right:96px;padding-top:4px}
.hero .dog{position:absolute;right:-4px;top:-6px;width:92px;height:auto}
.kpis{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:8px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .l{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.kpi .v{font-family:var(--f-display);font-size:clamp(20px,6vw,26px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.big{grid-column:1/-1;background:var(--olive-soft);color:var(--olive-ink)}
.kpi.big .l{color:inherit;opacity:.8}
.kpi.big .v{font-size:42px;line-height:1.1}

/* timer */
.timer{display:flex;align-items:center;gap:12px;background:var(--wine);color:#FFF8F0;border-radius:16px;padding:12px 14px}
.timer .t{font-family:var(--f-display);font-size:28px;font-weight:800}
.timer .who{flex:1;min-width:0;font-weight:700;line-height:1.2}
.timer .who small{display:block;font-weight:700;opacity:.8}
.timer button{border:0;border-radius:12px;padding:10px 14px;background:#FBF3EA;color:var(--wine);font-weight:800}
.dot{width:10px;height:10px;border-radius:50%;background:#FBF3EA;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

/* rijen */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;display:block}
.row .t1{font-weight:800;font-size:19px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .t2{display:block;font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-family:var(--f-display);font-weight:800;font-size:21px;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-family:var(--f-body);font-size:14px;font-weight:700;color:var(--muted);text-transform:lowercase}
.time{font-family:var(--f-display);font-weight:800;font-size:20px;min-width:48px;color:var(--rose-ink);background:var(--rose-soft);border-radius:10px;padding:6px 8px;text-align:center}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;background:var(--rose-soft);color:var(--rose-ink);flex:none}
.av.p{background:var(--olive-soft);color:var(--olive-ink)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;line-height:1.5}
.b-bijt{background:var(--bad-soft);color:var(--bad)}
.b-letop{background:var(--warn-soft);color:var(--warn)}
.b-lief{background:var(--ok-soft);color:var(--ok)}
.b-pay{background:var(--surface-2);color:var(--muted)}
.b-done{background:var(--ok-soft);color:var(--ok)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.empty img{width:70px;height:auto;display:block;margin:0 auto 8px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:18px;margin-bottom:4px}

/* knoppen */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn-p{background:var(--wine);color:var(--cream)}
.btn-o{background:var(--olive);color:#2E2A06}
.btn-s{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn-d{background:var(--bad-soft);color:var(--bad)}
.btn-sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* tabbalk */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end}
.tab{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;font-weight:800;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--wine)}
.fab{justify-self:center;width:64px;height:64px;border-radius:50%;border:4px solid var(--bg);background:var(--olive);color:#FFFEF5;transform:translateY(-14px);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:30px;height:30px}

/* vel */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(125,52,70,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:100%;height:calc(100% - 24px - env(safe-area-inset-top,0px));border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-h h2{flex:1;font-size:26px;color:var(--wine);min-width:0}
.x{border:0;background:var(--surface-2);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.sheet-b{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.sheet-f{border-top:1px solid var(--line);background:var(--surface);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.sheet-f .tot{flex:1;min-width:0}
.sheet-f .tot .v{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1}

/* formulier */
.fld{display:flex;flex-direction:column;gap:8px}
.fld > label,.lbl{font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:17px;min-height:48px}
.inp:focus{border-color:var(--olive);outline:none}
textarea.inp{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:700;font-size:17px;min-height:42px;display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1.15}
.chip small{font-size:14px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:#FFF8F0}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.chip.price{min-width:92px}
.chip.price b{font-family:var(--f-display);font-weight:800;font-size:19px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 8px;font-weight:800;font-size:17px;min-height:56px}
.seg button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#2E2A06}
.seg.g button[data-v="lief"][aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg.g button[data-v="letop"][aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.seg.g button[data-v="bijt"][aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.mode button{border:0;background:none;border-radius:11px;padding:10px;font-weight:800;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.dogcard{border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.dogcard .hd{display:flex;gap:12px;align-items:center;padding:14px}
.dogcard .hd .n{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.1}
.dogcard .info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:0 14px 14px;font-size:14px}
.dogcard .info dt{color:var(--muted);font-weight:700}
.dogcard .info dd{margin:0;min-width:0}
.alert{display:flex;gap:10px;align-items:center;background:var(--bad-soft);color:var(--bad);font-weight:800;padding:10px 14px}
.alert.w{background:var(--warn-soft);color:var(--warn)}
.prodline{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.prodline:first-child{border-top:0}
.prodline .n{flex:1;min-width:0;font-weight:700}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:800}
.hint{font-size:15px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--wine);font-weight:800;text-decoration:underline;text-underline-offset:3px}

/* overzicht */
.periods{display:flex;align-items:center;gap:8px}
.periods .lab{flex:1;text-align:center;font-family:var(--f-display);font-size:20px;font-weight:800}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:150px;padding:8px 4px 0}
.bar{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px;border:0;background:none;padding:0;min-width:0}
.bar .s{border-radius:4px 4px 0 0;background:var(--rose)}
.bar .s.t{background:var(--olive);border-radius:0}
.bar .s.p{background:var(--wine);border-radius:0}
.bar[aria-current="true"] .s{outline:2px solid var(--ink);outline-offset:0}
.bar-l{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;padding:4px 4px 0;font-size:13px;font-weight:800;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--muted);font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.daygroup .dh{display:flex;justify-content:space-between;padding:10px 14px 4px;font-size:15px;font-weight:800;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.filters .chip{flex:none}

.xprev{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:14px;max-height:420px;overflow:auto;font-size:14px}
.xprev > *{min-width:0}
.xs-h{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--wine)}
.xs-m{font-weight:800;margin:6px 0 2px}
.xtable{overflow-x:auto}
.xtable table{border-collapse:collapse;width:100%}
.xtable th{text-align:left;font-size:13px;color:#fff;background:var(--rose);padding:4px 6px;font-weight:700}
.xtable td{padding:4px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
.xtable td:first-child,.xtable td.r{white-space:nowrap}
.xtable .r{text-align:right}
.xtable .tot td{font-weight:800;border-bottom:0;background:var(--surface-2)}
.xtable .more{color:var(--muted);font-style:italic}
.sync{font-size:14px;font-weight:700;color:#FFF8F0;background:rgba(255,255,255,.22);padding:5px 11px;border-radius:999px;white-space:nowrap}
.sync[data-s="ok"]{background:transparent;opacity:.85}
.sync[data-s="wait"]{background:var(--wine)}
.set-h{font-size:24px;color:var(--wine)}
body.koppel .tabs,body.koppel #btn-settings,body.koppel #btn-klant{display:none}
.iconbtn{position:relative}
.iconbtn .ndot{position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:var(--wine);border:2px solid var(--bg)}
.pthumb{width:52px;height:52px;flex:none;border-radius:12px;overflow:hidden;background:var(--cream);border:1px solid var(--line, rgba(0,0,0,.08));display:grid;place-items:center;padding:0;cursor:pointer;font-size:20px}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pthumb.big{width:96px;height:96px;font-size:30px;cursor:default}
.chip small .op{color:var(--bad)}
a.btn{text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--wine);color:#FFF8F0;padding:12px 18px;border-radius:14px;font-weight:800;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- klantenapp ---- */
.tabs-in{grid-template-columns:repeat(4,1fr)}
.tab{position:relative}
.tab .cnt{position:absolute;top:4px;left:calc(50% + 6px);min-width:20px;height:20px;border-radius:10px;background:var(--wine);color:var(--cream);font-size:13px;line-height:20px;padding:0 5px}
.mark-sub{letter-spacing:.14em}
.hello h1{font-size:36px}
.hello p{margin:0;color:var(--muted)}
.appt{display:flex;gap:14px;align-items:center}
.appt .cal{flex:none;width:64px;border-radius:14px;overflow:hidden;text-align:center;background:var(--surface);border:1px solid var(--line)}
.appt .cal .m{background:var(--wine);color:var(--cream);font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 0}
.appt .cal .d{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.15;color:var(--wine)}
.appt .wat{flex:1;min-width:0}
.appt .wat b{display:block;font-size:20px;line-height:1.2}
.appt .wat span{color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.prod{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;padding:0}
.prod .ph{aspect-ratio:1/1;background:var(--cream);position:relative;display:grid;place-items:center;overflow:hidden}
.prod .ph img{width:100%;height:100%;object-fit:cover;display:block}
.prod .ph img.ill{width:58%;height:auto;object-fit:contain;opacity:.9}
.prod .tag{position:absolute;left:8px;top:8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--olive);color:#2E2A06}
.prod .tag.op{background:var(--surface);color:var(--bad)}
.prod .tag.weinig{background:var(--warn-soft);color:var(--warn)}
.prod .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.prod .n{font-weight:800;font-size:17px;line-height:1.2}
.prod .pr{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--wine)}
.prod .act{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
.add{border:0;border-radius:12px;background:var(--olive);color:#2E2A06;font-weight:800;min-height:40px;padding:0 14px;flex:1}
.add[disabled]{background:var(--surface-2);color:var(--muted)}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:20px;line-height:1}
.qty span{min-width:20px;text-align:center;font-weight:800}
.cartbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:25;padding:0 16px}
.cartbar button{max-width:528px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px;border:0;border-radius:16px;background:var(--wine);color:var(--cream);padding:12px 16px;font-weight:800;font-size:17px;box-shadow:var(--shadow)}
.cartbar .t{margin-left:auto;font-family:var(--f-display);font-size:22px}
.line{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .n{flex:1;min-width:0;font-weight:700}
.line .p{font-family:var(--f-display);font-weight:800;font-size:19px;white-space:nowrap}
.socials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.socials a{text-decoration:none}
a.btn{text-decoration:none}
.openstatus{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:15px;border-radius:999px;padding:3px 10px}
.openstatus.open{background:var(--ok-soft);color:var(--ok)}
.openstatus.dicht{background:var(--surface-2);color:var(--muted)}
.dienst{display:flex;gap:10px;align-items:baseline;padding:12px 14px;border-top:1px solid var(--line)}
.dienst:first-child{border-top:0}
.dienst .n{flex:1;min-width:0}
.dienst .n b{display:block;font-size:18px}
.dienst .n span{color:var(--muted);font-size:16px}
.dienst .v{font-family:var(--f-display);font-weight:800;font-size:19px;color:var(--wine);white-space:nowrap}
.stars{display:flex;gap:6px;justify-content:center;color:#E3A33B}
.stars svg{width:38px;height:38px}
.done{text-align:center;display:grid;gap:10px;justify-items:center;padding:12px 0}
.done img{width:120px;height:auto}
.done h3{font-size:30px;color:var(--wine)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#FFF8F0;border-radius:14px;padding:10px 16px;font-weight:700;z-index:80;max-width:calc(100% - 32px);text-align:center}
.pill{display:inline-block;font-size:14px;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--olive-soft);color:var(--olive-ink)}
</style>

/* ---- verbinding ---- */
const P = new URLSearchParams(location.search);
const DEMO = !!window.TIMS_KLANT_DEMO;
const BRON = (P.get('s') || store.get('tk_s', '') || '').trim();
const CODE = (P.get('c') || store.get('tk_c', '') || '').trim().toLowerCase();
if (P.get('s')) store.set('tk_s', P.get('s').trim());
if (P.get('c')) store.set('tk_c', P.get('c').trim().toLowerCase());
const EXEC = /^https?:/.test(BRON) ? BRON : (BRON ? `https://script.google.com/macros/s/${BRON}/exec` : '');
const KEY_CACHE = 'tk_cache';

async function rpc(a, d){
  if (DEMO) return demoRpc(a, d);
  if (!EXEC) throw new Error('Deze link is niet compleet. Vraag Kim om de link opnieuw te sturen.');
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 30000);
  let txt;
  try { const r = await fetch(EXEC, {method:'POST', body: JSON.stringify({a, d: Object.assign({c: CODE}, d || {})}), redirect:'follow', signal:ctrl.signal}); txt = await r.text(); }
  catch(e){ const x = new Error('Geen verbinding. Probeer het zo nog eens.'); x.net = true; throw x; }
  finally { clearTimeout(t); }
  let j; try { j = JSON.parse(txt); } catch(e){ throw new Error('Er ging iets mis. Probeer het later nog eens.'); }
  if (!j.ok) throw new Error(j.error || 'Er ging iets mis');
  return j.data;
}

/* ---- voorbeeldmodus ---- */
function demoRpc(a, d){
  const D = window.TIMS_KLANT_DEMO;
  return new Promise(ok => setTimeout(() => {
    if (a === 'klantLoad') return ok(JSON.parse(JSON.stringify(D)));
    if (a === 'bestel'){ (d.items||[]).forEach(it => { const p = D.producten.find(x => x.id === it.id); if (p && p.voorraad != null) p.voorraad = Math.max(0, p.voorraad - it.aantal); });
      const b = {id:'b'+Date.now(), tijd:new Date().toISOString(), items:d.items.map(it => { const p = D.producten.find(x => x.id === it.id); return {id:it.id, naam:p.naam, prijs:p.prijs, aantal:it.aantal}; }), ophalen:d.ophalen, status:'nieuw'};
      b.totaal = r2(b.items.reduce((s,x) => s + x.prijs*x.aantal, 0)); if (D.klant) D.klant.bestellingen.push(b); return ok({id:b.id, totaal:b.totaal}); }
    if (a === 'aanvraag') return ok({id:'a'+Date.now()});
  }, 450));
}

/* ---- staat ---- */
const S = { data: store.get(KEY_CACHE + CODE, null), view: 'home', cart: store.get('tk_cart', {}), cat: '', me: store.get('tk_me', {naam:'', telefoon:''}) };
const salon = () => (S.data && S.data.salon) || {};
const klant = () => S.data && S.data.klant;
const prodById = id => (S.data.producten || []).find(p => p.id === id);
const voornaam = () => { const k = klant(); return k && k.naam ? k.naam.split(/[\s\/,&]/)[0] : (S.me.naam || '').split(' ')[0]; };
const toekomst = () => ((klant() || {}).afspraken || []).filter(e => new Date(e.end || e.start) > new Date()).sort((a,b) => a.start.localeCompare(b.start));
function saveCart(){ Object.keys(S.cart).forEach(k => { if (!S.cart[k] || !S.data || !prodById(k)) delete S.cart[k]; }); store.set('tk_cart', S.cart); cartUi(); }
const cartItems = () => Object.entries(S.cart).map(([id, n]) => ({p: prodById(id), n})).filter(x => x.p);
const cartTotal = () => r2(cartItems().reduce((s, x) => s + x.p.prijs * x.n, 0));
function cartUi(){
  const n = cartItems().reduce((s, x) => s + x.n, 0);
  $('#cartbar').hidden = !n || !!$('#sw'); $('#cart-n').textContent = `${n} in je mandje`; $('#cart-t').textContent = eur(cartTotal());
  const c = $('#tab-cnt'); c.hidden = !n; c.textContent = n;
  $('main').style.paddingBottom = n ? 'calc(180px + env(safe-area-inset-bottom,0px))' : '';
}

/* ---- vel ---- */
function sheet(title, body, foot){
  $('#sheet-root').innerHTML = `<div class="sheet-wrap" id="sw"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h2>${esc(title)}</h2><button class="x" id="sx" aria-label="Sluiten"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="sheet-b">${body}</div>${foot ? `<div class="sheet-f">${foot}</div>` : ''}</div></div>`;
  $('#sx').onclick = closeSheet; $('#sw').onclick = e => { if (e.target.id === 'sw') closeSheet(); };
  document.body.style.overflow = 'hidden'; cartUi();
}
function closeSheet(){ $('#sheet-root').innerHTML = ''; document.body.style.overflow = ''; cartUi(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sw')) closeSheet(); });

/* ---- navigatie ---- */
function go(v){ S.view = v; $$('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.tab === v ? 'page' : 'false')); render(); window.scrollTo(0, 0); }
function render(){ ({home:viewHome, winkel:viewWinkel, afspraak:viewAfspraak, info:viewInfo})[S.view]($('#view')); cartUi(); }

/* ---- agenda ---- */
const icsUrl = e => `${EXEC}?ics=${encodeURIComponent(CODE)}&e=${encodeURIComponent(e.id)}`;
const feedUrl = () => `${EXEC.replace(/^https:/, 'webcal:')}?feed=${encodeURIComponent(CODE)}`;
function gcalUrl(e){
  const f = d => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const s = salon();
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent((e.hond || 'Hond') + ' naar ' + (s.naam || 'Tims'))}&dates=${f(e.start)}/${f(e.end || e.start)}&location=${encodeURIComponent(s.adres || '')}&details=${encodeURIComponent('Vragen of verzetten? App Kim: ' + (s.telefoon || ''))}`;
}
function agendaKeuze(e){
  sheet('In je agenda zetten', `
    <p style="margin:0">${e ? `<b>${esc(e.hond || '')}</b> · ${esc(cap(nl(e.start, {weekday:'long', day:'numeric', month:'long'})))} om ${esc(tijd(e.start))}` : 'Al je afspraken bij Tims, en nieuwe afspraken komen er vanzelf bij.'}</p>
    ${e ? `<a class="btn btn-p" href="${esc(icsUrl(e))}" data-demo>iPhone / Apple Agenda</a><a class="btn btn-s" href="${esc(gcalUrl(e))}" target="_blank" rel="noopener" data-demo>Google Agenda</a>
      <div class="card pad stack" style="gap:8px"><b>Nooit meer zelf overzetten?</b><p class="hint" style="margin:0">Abonneer je één keer: dan staan al je Tims-afspraken automatisch in je agenda, ook nieuwe en verzette.</p><button class="btn btn-s btn-sm" id="ag-feed" style="align-self:flex-start">Automatisch bijwerken</button></div>`
      : `<a class="btn btn-p" href="${esc(feedUrl())}" data-demo>Abonneer in Apple Agenda</a>
      <a class="btn btn-s" href="https://calendar.google.com/calendar/r?cid=${encodeURIComponent(feedUrl())}" target="_blank" rel="noopener" data-demo>Abonneer in Google Agenda</a>
      <p class="hint" style="margin:0">Je krijgt een dag van tevoren een herinnering.</p>`}`);
  const f = $('#ag-feed'); if (f) f.onclick = () => agendaKeuze(null);
  if (DEMO) $$('[data-demo]').forEach(a => a.onclick = ev => { ev.preventDefault(); toast('In de echte app opent dit je agenda'); });
}

      await rpc('aanvraag', {hond, behandeling: A.behandeling, voorkeur: [A.wanneer, A.dagdeel].filter(Boolean).join(', '), opmerking: A.opm, naam, telefoon: tel, website: $('#av-hp').value});
      S._av = null;
      el.innerHTML = `<div class="card pad"><div class="done"><img src="${DOG}" alt=""><h3>Aanvraag verstuurd!</h3><p style="margin:0">Kim appt je zo snel mogelijk met een voorstel voor ${esc(hond)}.</p><button class="btn btn-s" id="av-home">Terug naar home</button></div></div>`;
      $('#av-home').onclick = () => go('home');
    } catch(e){ btn.disabled = false; btn.textContent = 'Aanvraag versturen'; toast(e.message); }
  };
}

/* ---- INFO ---- */
function openNu(txt){
  const dagen = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
  const t = String(txt || '').toLowerCase();
  const m = t.match(/(maandag|dinsdag|woensdag|donderdag|vrijdag|zaterdag|zondag)\s*(?:t\/m|tot en met|-|–)\s*(maandag|dinsdag|woensdag|donderdag|vrijdag|zaterdag|zondag)/);
  const u = t.match(/(\d{1,2})[.:](\d{2})\s*[–-]\s*(\d{1,2})[.:](\d{2})/);
  if (!m || !u) return null;
  const a = dagen.indexOf(m[1]), b = dagen.indexOf(m[2]), n = new Date(), d = n.getDay();
  const inDag = a <= b ? d >= a && d <= b : d >= a || d <= b;
  const min = n.getHours() * 60 + n.getMinutes(), van = +u[1] * 60 + +u[2], tot = +u[3] * 60 + +u[4];
  return inDag && min >= van && min < tot ? {open: true, tekst: `Nu open tot ${u[3]}.${u[4]}`} : {open: false, tekst: 'Nu gesloten'};
}
function viewInfo(el){
  const s = salon(), D = S.data.diensten || [], o = openNu(s.openingstijden);
  const link = (href, label, icoon, cls) => href ? `<a class="btn ${cls || 'btn-s'}" href="${esc(href)}" target="_blank" rel="noopener">${icoon || ''}${label}</a>` : '';
  el.innerHTML = `<div class="stack">
    <section class="day hero"><div class="band checker" aria-hidden="true"></div><div class="hd"><div class="eyebrow">Over ons</div><h1>${esc(s.naam || 'Tims Hondentrimsalon')}</h1><img class="dog" src="${DOG}" alt=""></div>
      ${o ? `<span class="openstatus ${o.open ? 'open' : 'dicht'}" style="justify-self:start">${o.open ? '●' : '○'} ${esc(o.tekst)}</span>` : ''}
      <p style="margin:0">${esc(s.openingstijden || '')}</p></section>
    ${D.length ? `<div class="sec-h"><h2>Behandelingen</h2><span class="meta">prijzen vanaf</span></div><div class="card">${D.map(d => `<div class="dienst"><span class="n"><b>${esc(d.naam)}</b>${d.omschrijving ? `<span>${esc(d.omschrijving)}</span>` : ''}</span>${d.vanaf != null ? `<span class="v num">${eur(d.vanaf)}</span>` : ''}</div>`).join('')}</div>
      <p class="hint" style="margin:0">De prijs hangt af van ras, vacht en hoe lang het duurt.</p>` : ''}
    <div class="sec-h"><h2>Contact</h2></div>
    <div class="card pad stack" style="gap:10px">
      ${s.adres ? `<div><b>Adres</b><br>${esc(s.adres)}</div>` : ''}
      <div class="btnrow">${s.telefoon ? `<a class="btn btn-o btn-sm" href="${esc(waLink(s.telefoon, 'Hoi Kim, '))}" target="_blank" rel="noopener" style="flex:1">WhatsApp</a><a class="btn btn-s btn-sm" href="tel:${esc(s.telefoon.replace(/\s/g, ''))}" style="flex:1">Bellen</a>` : ''}
        ${s.adres ? `<a class="btn btn-s btn-sm" href="https://maps.google.com/?q=${encodeURIComponent(s.adres)}" target="_blank" rel="noopener" style="flex:1">Route</a>` : ''}</div>
      ${s.email ? `<a href="mailto:${esc(s.email)}" style="color:var(--wine);font-weight:700">${esc(s.email)}</a>` : ''}</div>
    ${s.instagram || s.facebook || s.website ? `<div class="sec-h"><h2>Volg Tims</h2></div><div class="socials">${link(s.instagram, 'Instagram')}${link(s.facebook, 'Facebook')}${link(s.website, 'Website')}</div>` : ''}
    ${s.reviewLink ? `<button class="btn btn-s" id="i-review">${ster(18)} Schrijf een Google-review</button>` : ''}
    <div class="card pad stack" style="gap:8px;border-color:var(--olive)"><b>Ken je iemand met een hond?</b><p class="hint" style="margin:0">Stuur de Tims-app door. Dan kunnen zij ook makkelijk een afspraak aanvragen.</p><button class="btn btn-o btn-sm" id="i-deel" style="align-self:flex-start">App doorsturen</button></div>
  </div>`;
  const r = $('#i-review', el); if (r) r.onclick = reviewVel;
  $('#i-deel', el).onclick = deelVriend;
}
async function deelVriend(){
  const u = new URL(location.href); u.searchParams.delete('c'); u.hash = '';
  const tekst = `Ken je ${salon().naam || 'Tims Hondentrimsalon'} al? Hier vraag je makkelijk een afspraak aan voor je hond 🐾`;
  if (navigator.share){ try { await navigator.share({text: tekst, url: u.toString()}); return; } catch(e){ if (e && e.name === 'AbortError') return; } }
  window.open(`https://wa.me/?text=${encodeURIComponent(tekst + '\n' + u.toString())}`, '_blank', 'noopener');
}

/* ---- start ---- */
async function herlaad(){
  try { const d = await rpc('klantLoad', {}); S.data = d; store.set(KEY_CACHE + CODE, d); saveCart(); if (!$('#sw') && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) render(); return true; }
  catch(e){ if (!S.data) $('#view').innerHTML = `<div class="loading stack" style="text-align:center;gap:12px"><img src="${DOG}" alt="" style="width:100px;margin:0 auto"><div>${esc(e.message)}</div><button class="btn btn-p" onclick="start()">Opnieuw proberen</button></div>`; return false; }
}
function kop(){
  const s = salon(); const wa = $('#btn-wa');
  if (s.telefoon){ wa.hidden = false; wa.href = waLink(s.telefoon, 'Hoi Kim, '); }
  document.title = s.naam || 'Tims Hondentrimsalon';
}
async function start(){
  $('#demo-banner').hidden = !DEMO;
  if (S.data){ kop(); render(); }
  const ok = await herlaad();
  if (ok){ kop(); misschienReview(); }
}
$$('.tab').forEach(t => t.onclick = () => go(t.dataset.tab));
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.data) herlaad(); });
start();
</script>

<script>
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', {scope: './'}).then(reg => {
    setInterval(() => reg.update(), 30 * 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update(); });
  }).catch(() => {});
  let herladen = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || herladen) return; herladen = true;
    const wacht = () => { if (document.getElementById('sw')) return setTimeout(wacht, 5000); location.reload(); };
    wacht();
  });
}
</script>
